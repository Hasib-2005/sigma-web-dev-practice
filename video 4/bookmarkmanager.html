<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager - CodeWithHasib</title>
</head>
<body>
    <h1>My Bookmark</h1>
    <h2>Primary Bookmark</h2>
    <a target = "_blank" href = "https://www.google.com">Open Google</a> <br> 
    <!-- target = "_blank"  is used to open the links in a new tab -->
    <a target = "_blank" href = "https://www.facebook.com">Open facebook</a>
    <h2>Secondary Bookmark</h2>
    <a target="_blank" href="https://codeforces.com">Codeforce</a>
</body>
</html>
