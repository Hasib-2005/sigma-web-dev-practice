<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selectors */
        div {
            /* background-color: red; */
        }
        /* Class Selector */
        .red {
            background-color: red;
        }
        /* ID selector */
        #green {
            background-color: green;
        }
        /* Child Selectors */
        div > p {
            color: blue;
            background-color: aquamarine;
        }

        /* Discendant Selector */
        div p {
            color: blue;
            background-color: aquamarine;
        }
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
        }
        /* Pseudo Selector */
        a:visited {
            color : yellow;
        }
        a:link {
            color : green;
        }
        a:active {
            background-color: red;
        }
        a:hover {
            background-color: yellow;
        }
        p:first-child {
            background-color: blueviolet;
        }

    </style>
</head>
<body>
    <main class="one">
        <p>I am first</p>
        <p>I am Second</p>
    </main>
    <div id="green">
        I am a div.
        <article>
            <p>Hello I am Div..</p>
        </article>
    </div>
    <div class="red">
        I am another div.
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook2.com">Go to Facebook</a>
</body>
</html>
